<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLS Request Log · Lab Scheduler</title>
  <style>
    :root{--bg:#0b1419;--panel:#111f27;--panel2:#16272f;--border:rgba(255,255,255,0.08);--text:#e6edf0;--text2:#8ea0a8;--accent:#2ad2c9;--muted:#6f8a93}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
    a{color:var(--accent);text-decoration:none}
    .topbar{display:flex;align-items:center;gap:16px;padding:14px 28px;background:linear-gradient(180deg,#12242d,#0e1c23);border-bottom:1px solid var(--border)}
    .topbar .brand{font-weight:800;font-size:17px}.topbar .brand span{color:var(--accent)}
    .topbar .tag{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
    .topbar .right{margin-left:auto;display:flex;gap:14px;font-size:13px}
    .wrap{max-width:1200px;margin:0 auto;padding:24px}
    .hero{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    h1{font-size:22px;font-weight:800}
    .count{color:var(--text2);font-size:13px}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
    .path{color:var(--text2);font-size:12px;margin-bottom:12px;word-break:break-all}
    pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:16px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;color:var(--text)}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span>Lab</span> Scheduler</div>
    <div class="tag">Admin Console</div>
    <div class="right">
      <a href="{{ rp }}{{ admin_path }}">← Admin</a>
      <a href="{{ rp }}{{ admin_path }}/logout">Log out</a>
    </div>
  </div>

  <div class="wrap">
    <div class="hero">
      <h1>VLS request log</h1>
      <div class="count">{{ count }} line{% if count != 1 %}s{% endif %}</div>
    </div>
    <div class="panel">
      <div class="path">Log file: {{ log_path }}</div>
      <pre>{% for line in lines %}{{ line }}
{% endfor %}</pre>
    </div>
  </div>
</body>
</html>
